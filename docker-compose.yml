services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-siram}
      POSTGRES_USER: ${DB_USER:-siram}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siram_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - siram_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-siram} -d ${DB_NAME:-siram}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  siram_pgdata:
